<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1f497d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hanuman Transport">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Open Bale Pavati Entry - Hanuman Transport</title>
<style>
  * { box-sizing: border-box; font-family: Arial, sans-serif; }
  body { margin: 0; background: #eef2f7; color: #1a202c; }
  .header { background: #1f497d; color: #fff; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20; gap: 6px; }
  .header h1 { margin: 0; font-size: 14px; }
  .header small { color: #d8e6f8; font-size: 10px; }
  .hdr-btns { display: flex; gap: 5px; align-items: center; }
  .gear-btn { background: #16365c; color: #fff; border: 1px solid #6b9ed4; border-radius: 6px; padding: 6px 8px; font-size: 11px; font-weight: bold; cursor: pointer; }
  .sync-btn { background: #25D366; color: #fff; border: none; border-radius: 6px; padding: 6px 9px; font-size: 11px; font-weight: bold; cursor: pointer; }
  .install-btn { display: none; background: #f59e0b; color: #111; border: none; border-radius: 6px; padding: 6px 9px; font-size: 11px; font-weight: bold; cursor: pointer; }
  .container { max-width: 520px; margin: 12px auto; padding: 0 12px 36px; }
  .install-banner { display: none; background: #fffbeb; border: 1.5px solid #f59e0b; color: #78350f; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 12px; justify-content: space-between; align-items: center; gap: 8px; }
  .install-banner button { background: #1f497d; color: #fff; border: none; border-radius: 6px; padding: 7px 11px; font-weight: bold; font-size: 12px; cursor: pointer; flex-shrink: 0; }
  .card { background: #20b2aa; color: #fff; border-radius: 10px; padding: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.12); }
  .card h2 { margin: 0 0 12px; font-size: 15px; text-align: center; letter-spacing: 0.4px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
  .input-group { display: flex; gap: 6px; }
  .field input { width: 100%; padding: 10px; border-radius: 6px; border: none; font-size: 15px; font-weight: bold; text-align: center; background: #fff; color: #111; }
  .picker-input { cursor: pointer; caret-color: transparent; }
  .mini-btn { background: #16365c; color: #fff; border: none; border-radius: 6px; padding: 0 12px; font-size: 14px; font-weight: bold; cursor: pointer; flex-shrink: 0; }
  .preview-box { background: #dcffdc !important; color: #c0392b !important; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-save { width: 100%; background: #28a745; color: #fff; border: none; border-radius: 8px; padding: 13px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 6px; }
  .btn-clear { width: 100%; background: #ffc107; color: #000; border: none; border-radius: 8px; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; }
  .status { margin-top: 10px; text-align: center; font-size: 13px; font-weight: bold; min-height: 20px; color: #fff3cd; }
  .settings-box { display: none; background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .settings-box input { width: 100%; padding: 8px; border: 1px solid #94a3b8; border-radius: 6px; font-size: 13px; margin: 6px 0 10px; }
  .btn-url { background: #1f497d; color: #fff; border: none; border-radius: 6px; padding: 8px 14px; font-weight: bold; cursor: pointer; }
  .recent { background: #fff; border-radius: 10px; padding: 12px; margin-top: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .recent-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 6px; }
  .recent-head h3 { margin: 0; font-size: 14px; color: #1f497d; }
  .filter-inp { padding: 5px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; width: 145px; }
  .item { border-bottom: 1px solid #e2e8f0; padding: 9px 2px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .item:last-child { border-bottom: none; }
  .grp-tag { display: inline-block; background: #e6fffa; color: #0f766e; border: 1px solid #99f6e4; border-radius: 4px; padding: 1px 6px; font-size: 10px; font-weight: bold; margin-top: 2px; }
  .item-actions { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
  .btn-grp-send { background: #128C7E; color: #fff; border: none; border-radius: 5px; padding: 6px 9px; font-size: 11px; font-weight: bold; cursor: pointer; }
  .btn-slip { background: #25D366; color: #fff; border: none; border-radius: 5px; padding: 6px 9px; font-size: 11px; font-weight: bold; cursor: pointer; }

  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 50; justify-content: center; align-items: center; padding: 14px; }
  .modal-card { background: #fff; color: #111; width: 100%; max-width: 390px; border-radius: 12px; padding: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .modal-head h3 { margin: 0; font-size: 15px; color: #1f497d; }
  .close-x { background: #dc3545; color: #fff; border: none; border-radius: 6px; padding: 4px 9px; font-weight: bold; cursor: pointer; }
  .search-box { width: 100%; padding: 9px 10px; border: 1.5px solid #20b2aa; border-radius: 7px; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
  .popup-list { max-height: 230px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 7px; }
  .popup-option { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; font-size: 14px; font-weight: bold; cursor: pointer; }
  .popup-option:hover, .popup-option.active { background: #20b2aa; color: #fff; }
  .popup-option:last-child { border-bottom: none; }

  .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cal-nav button { background: #1f497d; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-weight: bold; cursor: pointer; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-dow { font-size: 11px; font-weight: bold; color: #1f497d; padding: 4px 0; }
  .cal-day { padding: 8px 0; border: none; border-radius: 6px; background: #f8fafc; font-weight: bold; font-size: 13px; cursor: pointer; }
  .cal-day:hover { background: #20b2aa; color: #fff; }
  .cal-today { background: #28a745; color: #fff; }

  .slip-img-wrap { text-align: center; max-height: 330px; overflow-y: auto; border: 1px solid #cbd5e1; border-radius: 8px; padding: 6px; background: #f8fafc; margin-bottom: 10px; }
  .slip-img-wrap img { max-width: 100%; height: auto; border-radius: 4px; }
  .slip-cfg-box { background: #f1f5f9; border-radius: 8px; padding: 8px; margin-bottom: 8px; }
  .slip-cfg-box label { display: block; font-size: 11px; font-weight: bold; color: #334155; margin-bottom: 3px; }
  .slip-cfg-box input { width: 100%; padding: 7px; border: 1px solid #94a3b8; border-radius: 6px; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
  .slip-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .slip-btns button { padding: 10px; border: none; border-radius: 7px; font-weight: bold; font-size: 12px; cursor: pointer; color: #fff; }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>OPEN BALE PAVATI ENTRY</h1>
    <small id="syncMeta">HANUMAN TRANSPORT • MALEGAON</small>
  </div>
  <div class="hdr-btns">
    <button class="install-btn" id="hdrInstallBtn" onclick="triggerInstallApp()">📲 INSTALL</button>
    <button class="sync-btn" onclick="pullFromCloud(false)">🔄 SYNC</button>
    <button class="gear-btn" onclick="toggleSettings()">⚙️ URL</button>
  </div>
</div>

<div class="container">
  <div class="install-banner" id="installBanner">
    <span><b>Open Bale Pavati App</b> apne mobile ki Home Screen par install karein!</span>
    <button onclick="triggerInstallApp()">Install App</button>
  </div>

  <div class="settings-box" id="settingsBox">
    <label style="font-size:12px;font-weight:bold;">Google Apps Script Web App URL:</label>
    <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
    <button class="btn-url" onclick="saveApiUrl()">Save URL</button>
  </div>

  <div class="card">
    <h2>OPEN BALE PAVATI ENTRY</h2>

    <div class="row-2">
      <div class="field">
        <label>Date (Calendar 📅)</label>
        <div class="input-group">
          <input type="text" id="v_date" readonly class="picker-input" onclick="openCalendarPopup()">
          <button type="button" class="mini-btn" onclick="openCalendarPopup()">📅</button>
        </div>
      </div>
      <div class="field">
        <label>Pavati No. (Unique Serial)</label>
        <input type="text" id="p_no" placeholder="1" onkeydown="handleEnter(event, 'bales')">
      </div>
    </div>

    <div class="field">
      <label>Party Name (Tap for List)</label>
      <div class="input-group">
        <input type="text" id="party" readonly class="picker-input" placeholder="Tap for Party List" onclick="openSearchPopup('party')">
        <button type="button" class="mini-btn" onclick="openSearchPopup('party')">🔍</button>
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label>Token No (Tap for List)</label>
        <div class="input-group">
          <input type="text" id="token" readonly class="picker-input" placeholder="Tap for Token" onclick="openSearchPopup('token')">
          <button type="button" class="mini-btn" onclick="openSearchPopup('token')">🔍</button>
        </div>
      </div>
      <div class="field">
        <label>Quality (Tap for List)</label>
        <div class="input-group">
          <input type="text" id="quality" readonly class="picker-input" placeholder="Tap for Quality" onclick="openSearchPopup('quality')">
          <button type="button" class="mini-btn" onclick="openSearchPopup('quality')">🔍</button>
        </div>
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label>Total Bales</label>
        <input type="number" id="bales" inputmode="numeric" oninput="calcBales()" onkeydown="handleEnter(event, 'start_no')">
      </div>
      <div class="field">
        <label>Start Bale No (Optional)</label>
        <input type="number" id="start_no" inputmode="numeric" oninput="calcBales()" onkeydown="handleEnter(event, 'bale_no')">
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label>Bale No (Auto / Manual)</label>
        <input type="text" id="bale_no" class="preview-box" placeholder="Auto or Manual" onkeydown="handleEnter(event, 'than')">
      </div>
      <div class="field">
        <label>Than</label>
        <input type="text" id="than" placeholder="e.g. 80" onkeydown="handleThanEnter(event)">
      </div>
    </div>

    <button class="btn-save" id="saveBtn" onclick="submitEntry()">SAVE PAVATI & SYNC</button>
    <button class="btn-clear" onclick="clearForm()">CLEAR</button>
    <div class="status" id="statusMsg"></div>
  </div>

  <div class="recent">
    <div class="recent-head">
      <h3>Pavati List (Party WA Group Send)</h3>
      <input type="text" id="dataFilterInp" class="filter-inp" placeholder="Search Party / No..." oninput="renderRecent()">
    </div>
    <div id="recentList"><div style="color:#64748b;font-size:12px;">Data load ho raha hai...</div></div>
  </div>
</div>

<!-- SMART SEARCH POPUP MODAL -->
<div class="modal-backdrop" id="searchModal" onclick="backdropClose(event, 'searchModal')">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="searchModalTitle">Search</h3>
      <button class="close-x" onclick="closeModal('searchModal')">✕</button>
    </div>
    <input type="text" id="searchModalInput" class="search-box" placeholder="Type to search or new name..." oninput="filterPopupList()" onkeydown="onPopupSearchKey(event)">
    <div class="popup-list" id="searchPopupList"></div>
  </div>
</div>

<!-- DATE CALENDAR POPUP MODAL -->
<div class="modal-backdrop" id="calendarModal" onclick="backdropClose(event, 'calendarModal')">
  <div class="modal-card">
    <div class="modal-head">
      <h3>Select Date</h3>
      <button class="close-x" onclick="closeModal('calendarModal')">✕</button>
    </div>
    <div class="cal-nav">
      <button onclick="changeCalMonth(-1)">&lt;</button>
      <b id="calMonthTitle">Month Year</b>
      <button onclick="changeCalMonth(1)">&gt;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div style="margin-top:10px;text-align:center;">
      <button class="btn-url" style="background:#28a745;width:100%;" onclick="pickTodayDate()">Today</button>
    </div>
  </div>
</div>

<!-- WHATSAPP SLIP & PARTY GROUP MODAL -->
<div class="modal-backdrop" id="slipModal" onclick="backdropClose(event, 'slipModal')">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="slipModalTitle">Send Slip to Party WA Group</h3>
      <button class="close-x" onclick="closeModal('slipModal')">✕</button>
    </div>
    <div class="slip-img-wrap">
      <img id="slipPreviewImg" alt="Slip Preview">
    </div>
    <div class="slip-cfg-box">
      <label>Party WhatsApp Group Name (Yaad rakhne ke liye):</label>
      <input type="text" id="slipWaGroupName" placeholder="e.g. MTT Malegaon Group">
      <label>WhatsApp No (Optional - Direct Chat ke liye):</label>
      <input type="tel" id="slipWaPhone" placeholder="10-digit WhatsApp No (Optional)">
    </div>
    <div class="slip-btns">
      <button style="background:#25D366;" onclick="sendSlipPhotoToPartyWa()">📤 SEND SLIP PHOTO</button>
      <button style="background:#1f497d;" onclick="sendSlipTextToPartyWa()">💬 SEND WA TEXT</button>
    </div>
  </div>
</div>

<script>
const STORAGE_URL_KEY = "ht_sync_url";
const STORAGE_MASTER_KEY = "ht_master_cache";
const STORAGE_DATA_KEY = "ht_cloud_records";
const STORAGE_PARTY_GRP_KEY = "ht_party_wa_groups";

let popupType = "";
let popupNextField = "";
let popupFiltered = [];
let popupActiveIdx = 0;

let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let activeSlipItem = null;
let activeSlipDataUrl = "";
let activeSlipBlob = null;
let visibleRecords = [];
let deferredInstallPrompt = null;

/* --- PWA INSTALL PROMPT & SERVICE WORKER --- */
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById("hdrInstallBtn").style.display = "inline-block";
  document.getElementById("installBanner").style.display = "flex";
});

window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  document.getElementById("hdrInstallBtn").style.display = "none";
  document.getElementById("installBanner").style.display = "none";
  setStatus("App Home Screen par install ho gaya!", "#d4edda");
});

async function triggerInstallApp() {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    if (choice && choice.outcome === "accepted") {
      deferredInstallPrompt = null;
      document.getElementById("hdrInstallBtn").style.display = "none";
      document.getElementById("installBanner").style.display = "none";
    }
  } else {
    alert("Chrome me upar 3 dots (⋮) dabayein aur 'Add to Home screen' ya 'Install app' chunein.");
  }
}

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}

function todayStr() {
  const d = new Date();
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const yyyy = d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

function toggleSettings() {
  const box = document.getElementById("settingsBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function saveApiUrl() {
  const url = document.getElementById("apiUrlInput").value.trim();
  localStorage.setItem(STORAGE_URL_KEY, url);
  document.getElementById("settingsBox").style.display = "none";
  setStatus("URL saved! Syncing...", "#d4edda");
  pullFromCloud(false);
}

function setStatus(msg, color = "#fff3cd") {
  const el = document.getElementById("statusMsg");
  el.style.color = color;
  el.textContent = msg;
}

function calcBales() {
  const qty = parseInt(document.getElementById("bales").value, 10);
  const startRaw = document.getElementById("start_no").value.trim();
  const start = parseInt(startRaw, 10);
  const out = document.getElementById("bale_no");
  if (!isNaN(qty) && qty > 0 && startRaw !== "" && !isNaN(start)) {
    out.value = qty === 1 ? `${start}` : `${start} to ${start + qty - 1}`;
  }
}

function handleEnter(e, nextId) {
  if (e.key === "Enter") {
    e.preventDefault();
    const el = document.getElementById(nextId);
    if (el) el.focus();
  }
}

function handleThanEnter(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    submitEntry();
  }
}

function closeModal(id) {
  document.getElementById(id).style.display = "none";
}

function backdropClose(e, id) {
  if (e.target.id === id) closeModal(id);
}

/* --- PARTY WHATSAPP GROUP MAPPING --- */
function getPartyGroupMap() {
  try {
    const obj = JSON.parse(localStorage.getItem(STORAGE_PARTY_GRP_KEY) || "{}");
    return (obj && typeof obj === "object") ? obj : {};
  } catch (e) {
    return {};
  }
}

function savePartyGroupName(partyName, groupName) {
  const p = String(partyName || "").trim();
  const g = String(groupName || "").trim();
  if (!p) return;
  const map = getPartyGroupMap();
  if (g) {
    map[p] = g;
  } else {
    delete map[p];
  }
  localStorage.setItem(STORAGE_PARTY_GRP_KEY, JSON.stringify(map));
}

/* --- SAFE MASTER CACHE & CLOUD PULL --- */
function cleanStrList(arr) {
  if (!Array.isArray(arr)) return [];
  const out = [];
  for (const item of arr) {
    if (item === null || item === undefined) continue;
    const s = String(item).trim();
    if (s && !out.includes(s)) {
      out.push(s);
    }
  }
  return out;
}

function getMasterCache() {
  let raw = {};
  try {
    raw = JSON.parse(localStorage.getItem(STORAGE_MASTER_KEY) || "{}");
  } catch (e) {
    raw = {};
  }
  if (!raw || typeof raw !== "object") raw = {};
  const phonesObj = (raw.phones && typeof raw.phones === "object") ? raw.phones : {};
  const cleanPhones = {};
  for (const [k, v] of Object.entries(phonesObj)) {
    const ks = String(k || "").trim();
    if (ks && v !== null && v !== undefined) {
      cleanPhones[ks] = String(v).trim();
    }
  }
  return {
    parties: cleanStrList(raw.parties),
    tokens: cleanStrList(raw.tokens),
    qualities: cleanStrList(raw.qualities),
    phones: cleanPhones
  };
}

function mergeMasterToCache(masterObj) {
  const cache = getMasterCache();
  const src = (masterObj && typeof masterObj === "object") ? masterObj : {};

  cleanStrList(src.parties).forEach(p => {
    if (!cache.parties.includes(p)) cache.parties.push(p);
  });
  cleanStrList(src.tokens).forEach(t => {
    if (!cache.tokens.includes(t)) cache.tokens.push(t);
  });
  cleanStrList(src.qualities).forEach(q => {
    if (!cache.qualities.includes(q)) cache.qualities.push(q);
  });

  if (src.phones && typeof src.phones === "object") {
    for (const [k, v] of Object.entries(src.phones)) {
      const ks = String(k || "").trim();
      if (ks && v !== null && v !== undefined) {
        cache.phones[ks] = String(v).trim();
      }
    }
  }

  localStorage.setItem(STORAGE_MASTER_KEY, JSON.stringify(cache));
}

function rememberMaster(party, token, quality) {
  const cache = getMasterCache();
  const p = String(party || "").trim();
  const t = String(token || "").trim();
  const q = String(quality || "").trim();
  if (p && !cache.parties.includes(p)) cache.parties.push(p);
  if (t && !cache.tokens.includes(t)) cache.tokens.push(t);
  if (q && !cache.qualities.includes(q)) cache.qualities.push(q);
  localStorage.setItem(STORAGE_MASTER_KEY, JSON.stringify(cache));
}

function getStoredRecords() {
  try {
    const arr = JSON.parse(localStorage.getItem(STORAGE_DATA_KEY) || "[]");
    return Array.isArray(arr) ? arr : [];
  } catch (e) {
    return [];
  }
}

function saveStoredRecords(recs) {
  localStorage.setItem(STORAGE_DATA_KEY, JSON.stringify(Array.isArray(recs) ? recs : []));
}

function isDuplicatePno(pnoVal, recordsArr) {
  const target = String(pnoVal || "").trim().toLowerCase();
  if (!target) return false;
  const list = Array.isArray(recordsArr) ? recordsArr : getStoredRecords();
  return list.some(r => r && String(r.p_no || "").trim().toLowerCase() === target);
}

function applyNextSerialPno(recordsArr) {
  const list = Array.isArray(recordsArr) ? recordsArr : getStoredRecords();
  let maxNo = 0;
  for (const r of list) {
    if (!r) continue;
    const raw = String(r.p_no || "").trim();
    if (/^\d+$/.test(raw)) {
      const n = parseInt(raw, 10);
      if (n > maxNo) maxNo = n;
    }
  }
  const pnoEl = document.getElementById("p_no");
  if (maxNo > 0) {
    pnoEl.value = String(maxNo + 1);
  } else if (!pnoEl.value.trim()) {
    pnoEl.value = "1";
  }
}

async function pullFromCloud(silent = true) {
  const apiUrl = (localStorage.getItem(STORAGE_URL_KEY) || "").trim();
  if (!apiUrl) {
    if (!silent) {
      toggleSettings();
      setStatus("Pehle ⚙️ URL me Google Apps Script URL dalein!", "#ffcccc");
    }
    return;
  }

  try {
    if (!silent) setStatus("Master List aur Data sync ho raha hai...", "#fff3cd");
    const fetchUrl = apiUrl + (apiUrl.includes("?") ? "&" : "?") + "t=" + Date.now();
    const res = await fetch(fetchUrl, { method: "GET", cache: "no-store" });
    const rawText = await res.text();
    let data = null;
    try {
      data = JSON.parse(rawText);
    } catch (e) {
      throw new Error("Server se sahi JSON nahi mila (Apps Script Access 'Anyone' check karein)");
    }

    if (data && data.status === "ok") {
      if (data.master) mergeMasterToCache(data.master);
      const recs = Array.isArray(data.records) ? data.records : [];
      saveStoredRecords(recs.slice().reverse());
      applyNextSerialPno(recs);
      renderRecent();

      const mCache = getMasterCache();
      document.getElementById("syncMeta").textContent =
        `P:${mCache.parties.length} • T:${mCache.tokens.length} • Q:${mCache.qualities.length} • ${recs.length} Rows`;
      if (!silent) {
        setStatus(`Synced! Party:${mCache.parties.length}, Token:${mCache.tokens.length}, Quality:${mCache.qualities.length}, Data:${recs.length}`, "#d4edda");
      }
    } else {
      throw new Error((data && data.message) || "Cloud sync failed");
    }
  } catch (err) {
    if (!silent) setStatus("Sync error: " + err.message, "#ffcccc");
  }
}

/* --- SMART SEARCH POPUP (NO KEYBOARD ON FIELD TAP) --- */
function openSearchPopup(type) {
  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }
  popupType = type;
  const nextMap = { party: "token", token: "quality", quality: "bales" };
  const titleMap = { party: "Select Party Name", token: "Select Token No", quality: "Select Quality" };
  popupNextField = nextMap[type] || "bales";

  document.getElementById("searchModalTitle").textContent = titleMap[type] || "Select";
  const inp = document.getElementById("searchModalInput");
  inp.value = "";

  document.getElementById("searchModal").style.display = "flex";
  filterPopupList();
}

function filterPopupList() {
  const cache = getMasterCache();
  const keyMap = { party: "parties", token: "tokens", quality: "qualities" };
  const all = (cache[keyMap[popupType]] || []).slice().sort((a, b) => a.localeCompare(b));
  const q = document.getElementById("searchModalInput").value.trim().toLowerCase();

  popupFiltered = q ? all.filter(x => x.toLowerCase().includes(q)) : all;
  popupActiveIdx = 0;
  renderPopupOptions();
}

function renderPopupOptions() {
  const box = document.getElementById("searchPopupList");
  const typed = document.getElementById("searchModalInput").value.trim();

  if (!popupFiltered.length) {
    if (typed) {
      box.innerHTML = `<div class="popup-option active" onclick="pickPopupValue('${escapeHtml(typed)}')">+ Use New: "${escapeHtml(typed)}"</div>`;
    } else {
      box.innerHTML = `<div style="padding:12px;color:#64748b;font-size:13px;">List khali hai. 🔄 SYNC dabayein ya upar naya naam type karein.</div>`;
    }
    return;
  }

  box.innerHTML = popupFiltered.map((item, idx) =>
    `<div class="popup-option ${idx === popupActiveIdx ? "active" : ""}" onclick="pickPopupValue('${escapeHtml(item)}')">${escapeHtml(item)}</div>`
  ).join("");
}

function onPopupSearchKey(e) {
  if (e.key === "ArrowDown") {
    e.preventDefault();
    if (popupFiltered.length) {
      popupActiveIdx = (popupActiveIdx + 1) % popupFiltered.length;
      renderPopupOptions();
    }
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    if (popupFiltered.length) {
      popupActiveIdx = (popupActiveIdx - 1 + popupFiltered.length) % popupFiltered.length;
      renderPopupOptions();
    }
  } else if (e.key === "Enter") {
    e.preventDefault();
    const typed = document.getElementById("searchModalInput").value.trim();
    const chosen = popupFiltered.length ? popupFiltered[popupActiveIdx] : typed;
    if (chosen) pickPopupValue(chosen);
  }
}

function pickPopupValue(val) {
  document.getElementById(popupType).value = val;
  closeModal("searchModal");
  if (popupNextField === "bales") {
    const balesEl = document.getElementById("bales");
    if (balesEl) balesEl.focus();
  }
}

/* --- CALENDAR POPUP --- */
function openCalendarPopup() {
  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }
  const cur = document.getElementById("v_date").value.trim();
  const parts = cur.split("/");
  if (parts.length === 3) {
    const m = parseInt(parts[1], 10) - 1;
    const y = parseInt(parts[2], 10);
    if (!isNaN(m) && !isNaN(y) && m >= 0 && m <= 11) {
      calMonth = m;
      calYear = y;
    }
  }
  document.getElementById("calendarModal").style.display = "flex";
  renderCalendar();
}

function changeCalMonth(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear -= 1; }
  if (calMonth > 11) { calMonth = 0; calYear += 1; }
  renderCalendar();
}

function renderCalendar() {
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById("calMonthTitle").textContent = `${monthNames[calMonth]} ${calYear}`;

  const grid = document.getElementById("calGrid");
  const dows = ["Mo","Tu","We","Th","Fr","Sa","Su"];
  let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join("");

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const startOffset = (firstDay + 6) % 7;
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  const now = new Date();
  for (let i = 0; i < startOffset; i++) html += `<div></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const isToday = day === now.getDate() && calMonth === now.getMonth() && calYear === now.getFullYear();
    const dd = String(day).padStart(2, "0");
    const mm = String(calMonth + 1).padStart(2, "0");
    const formatted = `${dd}/${mm}/${calYear}`;
    html += `<button type="button" class="cal-day ${isToday ? "cal-today" : ""}" onclick="selectCalDate('${formatted}')">${day}</button>`;
  }
  grid.innerHTML = html;
}

function selectCalDate(val) {
  document.getElementById("v_date").value = val;
  closeModal("calendarModal");
}

function pickTodayDate() {
  selectCalDate(todayStr());
}

/* --- PAVATI LIST & PARTY WHATSAPP GROUP SEND --- */
function prependStoredRecord(item) {
  const list = getStoredRecords();
  list.unshift(item);
  saveStoredRecords(list.slice(0, 200));
  renderRecent();
}

function renderRecent() {
  const all = getStoredRecords();
  const grpMap = getPartyGroupMap();
  const q = (document.getElementById("dataFilterInp").value || "").trim().toLowerCase();
  visibleRecords = q
    ? all.filter(r => `${r.v_date} ${r.party} ${r.p_no} ${r.token} ${r.quality} ${r.bale_no}`.toLowerCase().includes(q))
    : all.slice(0, 25);

  const box = document.getElementById("recentList");
  if (!visibleRecords.length) {
    box.innerHTML = `<div style="color:#64748b;font-size:12px;">Koi pavati nahi mili. 🔄 SYNC dabayein.</div>`;
    return;
  }

  box.innerHTML = visibleRecords.map((r, idx) => {
    const grp = grpMap[r.party] || "";
    const grpBadge = grp
      ? `<span class="grp-tag">WA Group: ${escapeHtml(grp)}</span>`
      : `<span class="grp-tag" style="background:#f8fafc;color:#64748b;border-color:#cbd5e1;">Tap "Send WA Group" to set group</span>`;
    return `
      <div class="item">
        <div>
          <b>#${escapeHtml(r.p_no || "-")}</b> ${escapeHtml(r.party)} (${escapeHtml(r.bale_no)})<br>
          <small style="color:#64748b;">${escapeHtml(r.v_date)} • ${escapeHtml(String(r.bales))} Bales${r.quality ? " • " + escapeHtml(r.quality) : ""}</small><br>
          ${grpBadge}
        </div>
        <div class="item-actions">
          <button type="button" class="btn-grp-send" onclick="openSlipModal(${idx})">Send WA Group</button>
          <button type="button" class="btn-slip" onclick="directSendToPartyWa(${idx})">Quick WA</button>
        </div>
      </div>
    `;
  }).join("");
}

function buildSlipCanvas(r) {
  const W = 720, H = 900;
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = "#999999";
  ctx.lineWidth = 2;
  ctx.strokeRect(15, 15, W - 30, H - 30);

  ctx.fillStyle = "#222222";
  ctx.font = "bold 33px Arial";
  ctx.fillText("HANUMAN TRANSPORT", 150, 72);

  ctx.font = "bold 17px Arial";
  ctx.fillText("150/3/2, Trupati Market, Motibag Naka, Malegaon - 423203", 40, 118);
  ctx.fillText("Dist. Nashik (Maharastra) Mob. : 93254 12149, 77269 70691", 40, 144);

  ctx.strokeStyle = "#333333";
  ctx.beginPath();
  ctx.moveTo(30, 172);
  ctx.lineTo(W - 30, 172);
  ctx.stroke();

  ctx.fillStyle = "#222222";
  ctx.font = "bold 24px Arial";
  ctx.fillText("No.", 35, 220);

  ctx.fillStyle = "#c0392b";
  ctx.font = "bold 32px Arial";
  ctx.fillText(String(r.p_no || ""), 95, 222);

  ctx.fillStyle = "#222222";
  ctx.font = "bold 24px Arial";
  ctx.fillText("Date", 370, 220);

  ctx.beginPath();
  ctx.moveTo(435, 228);
  ctx.lineTo(W - 35, 228);
  ctx.stroke();

  ctx.fillStyle = "#1a237e";
  ctx.font = "bold 26px Arial";
  ctx.fillText(String(r.v_date || ""), 455, 220);

  const rows = [
    ["M/s.", r.party || "", 110],
    ["Token", r.token || "", 125],
    ["Quality", r.quality || "", 140],
    ["Bales", r.bale_no || "", 120],
    ["Than", r.than || "", 115],
    ["Total Bale", String(r.bales ?? ""), 175]
  ];

  let y = 310;
  for (const [label, val, lineStartX] of rows) {
    ctx.fillStyle = "#222222";
    ctx.font = "bold 24px Arial";
    ctx.fillText(label, 35, y);

    ctx.beginPath();
    ctx.moveTo(lineStartX, y + 8);
    ctx.lineTo(W - 35, y + 8);
    ctx.stroke();

    ctx.fillStyle = "#1a237e";
    ctx.font = "bold 26px Arial";
    ctx.fillText(String(val), lineStartX + 25, y);
    y += 86;
  }

  ctx.fillStyle = "#333333";
  ctx.font = "bold 22px Arial";
  ctx.fillText("Signature", W - 180, H - 65);

  return canvas;
}

function openSlipModal(idx) {
  const r = visibleRecords[idx];
  if (!r) return;
  activeSlipItem = r;

  const canvas = buildSlipCanvas(r);
  activeSlipDataUrl = canvas.toDataURL("image/png");
  document.getElementById("slipPreviewImg").src = activeSlipDataUrl;
  document.getElementById("slipModalTitle").textContent = `${r.party} • Pavati #${r.p_no || ""}`;

  const grpMap = getPartyGroupMap();
  document.getElementById("slipWaGroupName").value = grpMap[r.party] || "";

  const cache = getMasterCache();
  document.getElementById("slipWaPhone").value = (cache.phones && cache.phones[r.party]) || "";

  canvas.toBlob(blob => { activeSlipBlob = blob; }, "image/png");
  document.getElementById("slipModal").style.display = "flex";
}

function formatSlipText(r) {
  return [
    "*HANUMAN TRANSPORT - MALEGAON*",
    `*Pavati No.:* ${r.p_no || "-"}  |  *Date:* ${r.v_date || ""}`,
    `*M/s.:* ${r.party || ""}`,
    `*Token:* ${r.token || "-"}`,
    `*Quality:* ${r.quality || "-"}`,
    `*Bales:* ${r.bale_no || ""}`,
    `*Than:* ${r.than || "-"}`,
    `*Total Bale:* *${r.bales}*`
  ].join("\n");
}

function copyTextSafe(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).catch(() => {});
  }
}

async function directSendToPartyWa(idx) {
  const r = visibleRecords[idx];
  if (!r) return;
  const grpMap = getPartyGroupMap();
  const grpName = grpMap[r.party] || "";
  const canvas = buildSlipCanvas(r);
  const fileName = `Pavati_${r.p_no || "hanuman"}.png`;

  copyTextSafe(formatSlipText(r));

  if (navigator.share) {
    try {
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
      if (blob) {
        const file = new File([blob], fileName, { type: "image/png" });
        if (!navigator.canShare || navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: `Pavati #${r.p_no || ""} - ${r.party}`,
            text: formatSlipText(r)
          });
          return;
        }
      }
    } catch (e) {}
  }

  const text = encodeURIComponent(formatSlipText(r));
  alert(grpName
    ? `WhatsApp khul raha hai—"${grpName}" group me paste/send kar dein.`
    : `WhatsApp khul raha hai—party group me send kar dein.`
  );
  window.open(`https://wa.me/?text=${text}`, "_blank");
}

function sendSlipTextToPartyWa() {
  if (!activeSlipItem) return;
  const grpName = document.getElementById("slipWaGroupName").value.trim();
  savePartyGroupName(activeSlipItem.party, grpName);
  renderRecent();

  let phone = document.getElementById("slipWaPhone").value.replace(/\D/g, "");
  if (phone.length === 10) phone = "91" + phone;
  const text = encodeURIComponent(formatSlipText(activeSlipItem));
  window.open(phone ? `https://wa.me/${phone}?text=${text}` : `https://wa.me/?text=${text}`, "_blank");
}

async function sendSlipPhotoToPartyWa() {
  if (!activeSlipItem) return;
  const grpName = document.getElementById("slipWaGroupName").value.trim();
  savePartyGroupName(activeSlipItem.party, grpName);
  renderRecent();

  const fileName = `Pavati_${activeSlipItem.p_no || "hanuman"}.png`;
  copyTextSafe(formatSlipText(activeSlipItem));

  if (navigator.share && activeSlipBlob) {
    try {
      const file = new File([activeSlipBlob], fileName, { type: "image/png" });
      if (!navigator.canShare || navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: `Pavati #${activeSlipItem.p_no || ""} - ${activeSlipItem.party}`,
          text: formatSlipText(activeSlipItem)
        });
        return;
      }
    } catch (e) {}
  }

  const a = document.createElement("a");
  a.href = activeSlipDataUrl;
  a.download = fileName;
  a.click();

  let phone = document.getElementById("slipWaPhone").value.replace(/\D/g, "");
  if (phone.length === 10) phone = "91" + phone;
  alert(grpName
    ? `Slip photo download ho gayi hai. WhatsApp khul raha hai—"${grpName}" group me bhej dein.`
    : "Slip photo download ho gayi hai. WhatsApp khul raha hai—party group me bhej dein."
  );
  window.open(phone ? `https://wa.me/${phone}` : "https://web.whatsapp.com/", "_blank");
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function clearForm() {
  applyNextSerialPno();
  document.getElementById("party").value = "";
  document.getElementById("token").value = "";
  document.getElementById("quality").value = "";
  document.getElementById("bales").value = "";
  document.getElementById("start_no").value = "";
  document.getElementById("bale_no").value = "";
  document.getElementById("than").value = "";
}

async function submitEntry() {
  const apiUrl = (localStorage.getItem(STORAGE_URL_KEY) || "").trim();
  if (!apiUrl) {
    toggleSettings();
    setStatus("Pehle ⚙️ URL me Google Apps Script URL dalein!", "#ffcccc");
    return;
  }

  const pnoVal = document.getElementById("p_no").value.trim();
  if (!pnoVal) {
    setStatus("Pavati No. khali nahi reh sakta!", "#ffcccc");
    document.getElementById("p_no").focus();
    return;
  }

  if (isDuplicatePno(pnoVal)) {
    setStatus(`Duplicate Pavati No. (${pnoVal})! Ye pehle se darj hai.`, "#ffcccc");
    alert(`Duplicate Pavati No.!\nPavati No. "${pnoVal}" pehle se entry me maujood hai. Kripya naya number dalein.`);
    document.getElementById("p_no").focus();
    return;
  }

  const payload = {
    sync_id: "MOB-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
    v_date: document.getElementById("v_date").value.trim() || todayStr(),
    party: document.getElementById("party").value.trim(),
    p_no: pnoVal,
    token: document.getElementById("token").value.trim(),
    quality: document.getElementById("quality").value.trim(),
    bales: parseInt(document.getElementById("bales").value, 10) || 0,
    bale_no: document.getElementById("bale_no").value.trim(),
    than: document.getElementById("than").value.trim()
  };

  if (!payload.party || !payload.bales || !payload.bale_no) {
    setStatus("Party, Total Bales aur Bale No zaroori hai!", "#ffcccc");
    return;
  }

  const btn = document.getElementById("saveBtn");
  btn.disabled = true;
  btn.textContent = "CHECKING & SYNCING...";
  setStatus("Cloud me Pavati No. check karke save kiya ja raha hai...");

  try {
    const checkUrl = apiUrl + (apiUrl.includes("?") ? "&" : "?") + "t=" + Date.now();
    const checkRes = await fetch(checkUrl, { method: "GET", cache: "no-store" });
    const checkData = await checkRes.json();
    if (checkData && checkData.status === "ok" && Array.isArray(checkData.records)) {
      saveStoredRecords(checkData.records.slice().reverse());
      renderRecent();
      if (isDuplicatePno(pnoVal, checkData.records)) {
        applyNextSerialPno(checkData.records);
        setStatus(`Duplicate Pavati No. (${pnoVal})! Cloud me pehle se hai.`, "#ffcccc");
        alert(`Duplicate Pavati No.!\nPavati No. "${pnoVal}" cloud me pehle se save hai. Agla serial set kar diya gaya hai.`);
        return;
      }
    }

    const res = await fetch(apiUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (json.status === "ok") {
      rememberMaster(payload.party, payload.token, payload.quality);
      prependStoredRecord(payload);
      setStatus(`Saved! Pavati #${payload.p_no} sync ho gaya.`, "#d4edda");
      clearForm();
    } else {
      setStatus("Error: " + (json.message || "Sync failed"), "#ffcccc");
    }
  } catch (err) {
    setStatus("Internet / URL check karein: " + err.message, "#ffcccc");
  } finally {
    btn.disabled = false;
    btn.textContent = "SAVE PAVATI & SYNC";
  }
}

document.getElementById("v_date").value = todayStr();
document.getElementById("apiUrlInput").value = localStorage.getItem(STORAGE_URL_KEY) || "";
renderRecent();
applyNextSerialPno();
pullFromCloud(true);
</script>
